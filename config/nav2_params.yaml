# Nav2 parameters for Lite3 (Explorer) — no lidar; depth-derived obstacles.
# base frame is base_link (robonix motion root); the vendor TORSO is a fixed
# child of base_link (see urdf/Lite3.urdf). There is no /scan: costmap obstacle
# layers must live on depth/pointcloud sources, not a planar lidar scan.
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    odom_frame_id: odom
    # Lite3 has no planar lidar; AMCL laser_* params are inert. Localise via the
    # RGB-D map only; tune scan_topic if a /scan source is added later.
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      footprint_padding: 0.02
      # No /scan obstacle layer; leave the depth/pointcloud source to mapping.

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link

planner_server:
  ros__parameters:
    use_sim_time: false