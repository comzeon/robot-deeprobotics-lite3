# Nav2 parameters for Lite3 (Explorer).
# base frame is base_link (robonix motion root); the vendor TORSO is a fixed
# child of base_link (see urdf/Lite3.urdf). The 2D scan comes from the Livox
# MID-360S (sliced by lite3_lidar) on /scan; the costmap obstacle layer uses
# that planar scan.
amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      footprint_padding: 0.02
      # /scan obstacle layer from the MID-360S planar slice.

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link

planner_server:
  ros__parameters:
    use_sim_time: false