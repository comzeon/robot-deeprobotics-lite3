manifestVersion: 1
package:
  name: com.robonix.deeprobotics.lite3_chassis
  version: 0.2.0
  vendor: syswonder <dev@syswonder.org>
  description: >
    Lite3 quadruped chassis driver — ROS 2 topic bridge over the official
    `transfer` node (which owns the Motion-Host UDP sockets). Relays transfer's
    /leg_odom2 to /odom, publishes move() velocity bursts on /cmd_vel
    (velocity-only, hard-clamped), and exposes the twist_in subscription.
    See ADR-0005.
  license: MulanPSL-2.0
  tags: [quadruped, chassis, bridge, deeprobotics, lite3]
  maintainers:
    - "syswonder <dev@syswonder.org>"

build: bash scripts/build.sh
start: bash scripts/start.sh
stop: |
  pkill -TERM -f "[l]ite3_driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[l]ite3_driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver
  - name: robonix/primitive/chassis/stand
  - name: robonix/primitive/chassis/down
  - name: robonix/primitive/chassis/stop

# Onboarding §4.2/§8: documented public config fields.
config.spec:
  odom_source:
    type: string
    default: /leg_odom2
    description: "Official `transfer` node's leg odom+twist topic (nav_msgs/Odometry), bridged verbatim to /odom."
  odom_topic:
    type: string
    default: /odom
    description: "nav_msgs/Odometry output topic (odom capability)."
  cmd_vel_topic:
    type: string
    default: /cmd_vel
    description: "geometry_msgs/Twist topic the `transfer` node subscribes to; move() velocity bursts are published here."
  move_duration_sec:
    type: float
    default: 1.0
    description: "Default length (s) of a single move() velocity burst before an explicit stop is published."