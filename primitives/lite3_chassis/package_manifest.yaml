manifestVersion: 1
package:
  name: com.robonix.deeprobotics.lite3_chassis
  version: 0.1.0
  vendor: deeprobotics
  description: Lite3 quadruped chassis driver — UDP-based joint state readout + velocity control.
  license: MulanPSL-2.0
build: bash scripts/build.sh
start: bash scripts/start.sh
stop: |
  pkill -TERM -f "[l]ite3_driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[l]ite3_driver" 2>/dev/null || true
capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver
