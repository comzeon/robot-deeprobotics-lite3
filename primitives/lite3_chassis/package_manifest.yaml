manifestVersion: 1
package:
  name: com.robonix.deeprobotics.lite3_chassis
  version: 0.2.0
  vendor: syswonder <dev@syswonder.org>
  description: >
    Lite3 quadruped chassis driver — direct Motion Host UDP bridge (no transfer
    node). Receives RobotState/JointState/Imu/HandleState telemetry, publishes
    /odom + /joint_states + /ultrasound, accepts /cmd_vel and the
    robonix/primitive/chassis/move rpc (velocity-only, hard-clamped). See ADR-0001.
  license: MulanPSL-2.0
  tags: [quadruped, chassis, udp, deeprobotics, lite3]
  maintainers:
    - name: syswonder
      email: dev@syswonder.org

build: bash scripts/build.sh
start: bash scripts/start.sh
stop: |
  pkill -TERM -f "[l]ite3_driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[l]ite3_driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver

# Onboarding §4.2/§8: documented public config fields.
config.spec:
  robot_ip:
    type: string
    default: "192.168.1.1"
    description: "Motion Host (QNX) IP. DeepRobotics factory default 192.168.1.1."
  cmd_port:
    type: int
    default: 43893
    description: "Motion Host command port (UDP). Commands sent here."
  state_port:
    type: int
    default: 43897
    description: "Telemetry listen port (UDP, bound on the perception host)."
  base_frame:
    type: string
    default: base_link
    description: "Child frame of /odom; TF published by primitive-robot-description-rbnx."
  odom_topic:
    type: string
    default: /odom
    description: "nav_msgs/Odometry output topic."
  cmd_vel_topic:
    type: string
    default: /cmd_vel
    description: "geometry_msgs/Twist input topic (velocity set-point)."