manifestVersion: 1
name: robot-deeprobotics-lite3

# §1 catalog marker — required for community hardware package release.
catalog:
  name: DeepRobotics Lite3 (Explorer)
  version: 0.3.0
  description: >
    DeepRobotics Jueying Lite3 quadruped (Explorer SKU) deployment: direct UDP
    bridge to the Motion Host (no transfer-node hop), RGB-D perception via an
    external Orbbec Gemini 335 on eth1, 3D perception via a Livox MID-360S,
    mapping + Nav2 + frontier exploration.
  license: MulanPSL-2.0
  tags: [quadruped, legged, deeprobotics, lite3, rgbd, mid360s, lidar, nav2]
  maintainers:
    - name: syswonder
      email: dev@syswonder.org

# ROS 2 RMW + domain. The host is bare L4T; every ROS 2 process runs inside the
# robonix_lite3_ros container (bring it up with `bash container/start.sh` before
# `rbnx boot`), which shares this zenoh RMW + domain with the mapping/nav2/scene
# sibling containers (ADR-0004).
env:
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: rmw_zenoh_cpp

# ── primitives (booted after the system layer) ──────────────────────────────
# All primitives docker-exec into the pre-running robonix_lite3_ros container;
# rclpy / tf2_ros live there, not on the host. robot_state_publisher (the single
# TF publisher for the URDF's fixed chain) runs in that container from its
# entrypoint — it is NOT declared here as a primitive (ADR-0004).
primitive:
  - name: lite3_chassis
    path: ./primitives/lite3_chassis
    config:
      # DeepRobotics factory topology: motion host 192.168.1.1, SDK/perception
      # host 192.168.1.120. Commands → :43893, telemetry ← :43897 (ADR-0001).
      robot_ip: 192.168.1.1
      cmd_port: 43893
      state_port: 43897
      base_frame: base_link
      odom_topic: /odom
      cmd_vel_topic: /cmd_vel

  - name: lite3_camera
    path: ./primitives/lite3_camera
    config:
      # External Orbbec Gemini 335 on eth1. The vendor `orbbec_camera` driver
      # MUST be started before `rbnx boot` (ADR-0002). Defaults follow the
      # orbbec_camera launch topics.
      rgb_topic: /camera/color/image_raw
      # Orbbec depth topic is /camera/depth/image_raw (no `rect` — that's the
      # RealSense naming). Launch orbbec_camera's gemini_330_series.launch.py
      # with depth_registration:=true so depth is aligned to color for RGBD SLAM.
      depth_topic: /camera/depth/image_raw
      camera_info_topic: /camera/color/camera_info
      # Deployment-provided intrinsics fallback (used only until live CameraInfo
      # arrives). Fill with the calibrated Gemini 335 K for the deployment unit.
      width: 640
      height: 480
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0
      base_frame: base_link
      cam_frame: head_camera_rgb_optical_frame
      # First-frame sentinel: the Orbbec driver is racy on cold boot.
      sentinel_timeout_s: 150

  - name: lite3_lidar
    path: ./primitives/lite3_lidar
    config:
      # Livox MID-360S via livox_ros_driver2 (colcon package, baked into the
      # image). The vendor node MUST be running before `rbnx boot` (same
      # container/ROS domain). It publishes /livox/lidar (PointCloud2); this
      # primitive slices it into /scan (LaserScan) for Nav2/mapping.
      cloud_topic: /livox/lidar
      scan_topic: /scan
      frame_id: lidar_link
      band_m: 0.15
      range_min_m: 0.1
      range_max_m: 40.0
      bins: 720
      sentinel_timeout_s: 30

# ── services (booted after primitives) ───────────────────────────────────────
service:
  - name: memory
    path: ${ROBONIX_SOURCE_PATH}/services/memsearch
    config:
      backend: sqlite

  # Mapping publishes the occupancy / point cloud / pose contracts consumed by
  # Navigation and Scene. RGB-D + leg odom (ADR-0002), now fused with the
  # MID-360S planar lidar slice — lidar gives a reliable 2-D occupancy source and
  # RGB-D adds appearance for scene/3D fusion.
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    config:
      # Both lidar (MID-360S) and depth (Gemini 335) feed the occupancy grid.
      occupancy_sources: [lidar, depth]
      rtabmap_inputs: [lidar, rgbd, odom]
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar2d: lite3_lidar
        rgb: lite3_camera
        depth: lite3_camera
        odom: lite3_chassis

  # Nav2 wrapper — discovers /map (mapping), /odom (chassis), /scan (lidar)
  # through atlas and drives /cmd_vel via the navigate_to_pose action.
  - name: nav2
    url: https://github.com/syswonder/service-navigation-rbnx
    branch: main
    config:
      params_file: config/nav2_params.yaml
      action_wait_s: 240.0
      provider_ids:
        map: mapping
        odom: lite3_chassis
        scan: lite3_lidar

# ── skills (registered but not auto-activated) ──────────────────────────────
skill:
  - name: explore
    url: https://github.com/syswonder/skill-explore-rbnx
    branch: main
    config:
      explore_mode: frontier
      timeout_s: 600

# ── system layer ─────────────────────────────────────────────────────────────
system:
  atlas:
    listen: 0.0.0.0:50051
    log: info
  executor:
    listen: 127.0.0.1:50061
    log: info
  liaison:
    listen: 0.0.0.0:50081
    log: info
  pilot:
    listen: 127.0.0.1:50071
    log: debug
    vlm:
      api_format: openai
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      upstream: ${VLM_BASE_URL}
  scene:
    log: info
    camera_frame: head_camera_rgb_optical_frame